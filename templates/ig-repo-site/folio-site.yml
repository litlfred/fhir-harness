# TEMPLATE — an IG repository's OWN site, built with the folio-assistant
# harness and published to that repository's gh-pages (#2235, bean mftp).
#
# Copy to `.github/workflows/folio-site.yml` in the IG repository and replace
# the two placeholders:
#   @@INSTANCE@@  the folio-assistant instance that IS this IG (e.g. my-ig)
#   @@LABEL@@     the label its navbar home row carries (e.g. My Implementation Guide)
# The repository needs folio-assistant as a submodule at `folio-assistant/`.
#
# The site wears the MAIN site's chrome — search, the locale selector, the
# harness navbar — because the IG is composed INTO a chrome-only copy of the
# main site's Jekyll source (`compose-docs --shell`) at its root
# (`stage-ig-sites --compose-at-root`), and the shell's navbar is rendered for
# THIS instance (`gen-navbar-include --instance`): this IG first, then the
# harnesses it is built on, every other link to the main site.
#
# The base path is the REPOSITORY'S name on GitHub Pages, read rather than
# assumed, so the site is right whatever the repository is called.
#
# Manual trigger only (owner decision, 2026-10-06): an IG repository's site is
# published by hand from the Actions tab, never on push. Add a `push` trigger
# in the copy only if that repository's owner wants every push published.
#
# Built by hand, the IG sites drift apart: each wears the harness chrome of the
# platform it was last built with (bean 48a6). So the site says what built it
# (`folio-build.json` at its root) and the run REPORTS any sibling built with
# a different platform — a message, never a failure. Two repository VARIABLES
# configure it, so a copy needs no edit:
#   FOLIO_SITE_SIBLINGS      site URLs to compare with, space-separated
#   FOLIO_SITE_DEPENDENCIES  owner/repo@ref of the IGs this one depends on,
#                            whose folio-site is re-run after a publish
# The rebuild needs the FOLIO_SITE_DISPATCH_TOKEN secret, a token that may run
# workflows in those repositories; without it the summary says what was NOT
# rebuilt. Owner, 2026-10-09: "1, but rebuild dependency for now". Keep the
# dependency list acyclic, or two sites will rebuild each other for ever.
name: folio site

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: folio-site
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      INSTANCE: "@@INSTANCE@@"
      LABEL: "@@LABEL@@"
      BASE: /${{ github.event.repository.name }}
      MAIN_SITE: https://litlfred.github.io/folio-assistant
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: oven-sh/setup-bun@v2

      - name: Mount the platform's instances from its lock
        working-directory: folio-assistant
        # Since the separation (folio-assistant #2518) the platform's instances
        # (cat-harness, fhir-harness, folio-assistant-core, ...) are not in the
        # submodule: they are remote mounts pinned by its index.lock.json, laid
        # down by this script. Idempotent; it verifies each tree digest.
        run: bash .github/mount-from-lock.sh --root .

      - name: Install folio-assistant
        working-directory: folio-assistant
        run: bun install --frozen-lockfile

      - name: Set up Ruby for the site
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
          working-directory: folio-assistant/cat-harness/docs

      - name: The main site's chrome, with this instance's navbar
        working-directory: folio-assistant
        run: |
          # --instance/--title/--link-root scope the shell's harness data to THIS
          # IG (#2263): its tiles, icon row, rail scope and title, with the
          # main site's graphs linked there and none of its counts shown here.
          bun run cat-harness-tools/scripts/compose-docs.ts --out "$RUNNER_TEMP/docs" --shell \
            --instance "$INSTANCE" --title "$LABEL" --link-root "$MAIN_SITE"
          bun run cat-harness-tools/scripts/gen-navbar-include.ts --instance "$INSTANCE" \
            --link-root "$MAIN_SITE" --title "$LABEL" \
            --out "$RUNNER_TEMP/docs/_includes/generated/navbar-footer.html"

      - name: Restore the IG's FHIR AST, the source of site.data.fhir
        run: |
          # `ig-cache.sh restore` puts the AST at ./output-ast, where
          # ig-site-data reads the ImplementationGuide resource first (bean
          # jut3). Exit 1 is a cache MISS, not a failure: site.data.fhir then
          # comes from sushi-config.yaml, and the stage log says which.
          bash folio-assistant/fhir-harness/scripts/ig-cache.sh restore --ig-root . \
            || echo "no FHIR AST restored (exit $?): site.data.fhir from sushi-config.yaml"

      - name: Compose this IG at the site root
        working-directory: folio-assistant
        run: |
          curl -sSfL --retry 5 --retry-delay 15 --retry-all-errors -o "$RUNNER_TEMP/plantuml.jar" \
            https://repo1.maven.org/maven2/net/sourceforge/plantuml/plantuml/1.2024.7/plantuml-1.2024.7.jar
          # The work directory is OUTSIDE the checkout: the source copy is the
          # checkout, and a work directory inside it would copy itself.
          bun run fhir-harness/scripts/stage-ig-sites.ts --work "$RUNNER_TEMP/ig" --baseurl "$BASE" \
            --only "$INSTANCE" --source .. --plantuml-jar "$RUNNER_TEMP/plantuml.jar" \
            --compose-into "$RUNNER_TEMP/docs" --compose-at-root

      - name: Build the site
        run: |
          BUNDLE_GEMFILE="$PWD/folio-assistant/cat-harness/docs/Gemfile" bundle exec jekyll build \
            --source "$RUNNER_TEMP/docs" --destination ./_site --baseurl "$BASE"
          bun run folio-assistant/fhir-harness/scripts/build-ig-site.ts --dedupe-ids ./_site
          touch ./_site/.nojekyll

      - name: Publish this IG's served directories
        working-directory: folio-assistant
        run: |
          # Every `served: true` directory of THIS instance, read from its
          # declaration: the artefact index the JSON and IG API views fetch, and
          # the `openapi` graph that `openapi/index.html` links land on. The
          # graph's pages are generated here: only the ingested document is
          # committed, and its index is what the IG's Swagger links forward to.
          if [ -n "$(find "$INSTANCE" -maxdepth 3 -name cat-openapi.config.json -print -quit)" ]; then
            bun run cat-harness-tools/openapi/scripts/gen-openapi-pages.ts --instance "$INSTANCE"
          fi
          bun run fhir-harness/scripts/publish-served.ts --instance "$INSTANCE" --site ../_site

      - name: Give any page Jekyll did not lay out the same navbar
        working-directory: folio-assistant
        run: |
          bun run cat-harness-tools/scripts/rail-standalone-pages.ts --site ../_site --built cat-harness \
            --foreign-site --home-label "$LABEL" --instance "$INSTANCE"

      - name: Say which platform built this site
        working-directory: folio-assistant
        run: |
          bun run fhir-harness/scripts/site-build-stamp.ts stamp --site ../_site --instance "$INSTANCE" --platform .

      - name: Publish to gh-pages
        if: github.ref == 'refs/heads/main'
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: _site

      - name: Report platform drift against the sibling sites
        working-directory: folio-assistant
        run: |
          bun run fhir-harness/scripts/site-build-stamp.ts drift --self ../_site/folio-build.json \
            --sites "${{ vars.FOLIO_SITE_SIBLINGS }}"

      - name: Rebuild the IGs this one depends on
        if: github.ref == 'refs/heads/main'
        working-directory: folio-assistant
        env:
          FOLIO_SITE_DISPATCH_TOKEN: ${{ secrets.FOLIO_SITE_DISPATCH_TOKEN }}
        run: |
          bun run fhir-harness/scripts/site-build-stamp.ts dispatch --repos "${{ vars.FOLIO_SITE_DEPENDENCIES }}"
