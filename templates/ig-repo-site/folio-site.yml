# TEMPLATE — an IG repository's OWN site, built with the folio-assistant
# harness and published to that repository's gh-pages (#2235, bean mftp).
#
# Copy to `.github/workflows/folio-site.yml` in the IG repository and replace
# the two placeholders:
#   @@INSTANCE@@  the folio-assistant instance that IS this IG (e.g. my-ig)
#   @@LABEL@@     the label its navbar home row carries (e.g. My Implementation Guide)
# The repository needs folio-assistant as a submodule at `folio-assistant/`.
#
# The site wears the MAIN site's chrome — search, the locale selector, the
# harness navbar — because the IG is composed INTO a chrome-only copy of the
# main site's Jekyll source (`compose-docs --shell`) at its root
# (`stage-ig-sites --compose-at-root`), and the shell's navbar is rendered for
# THIS instance (`gen-navbar-include --instance`): this IG first, then the
# harnesses it is built on, every other link to the main site.
#
# The base path is the REPOSITORY'S name on GitHub Pages, read rather than
# assumed, so the site is right whatever the repository is called.
#
# Manual trigger only (owner decision, 2026-10-06): an IG repository's site is
# published by hand from the Actions tab, never on push. Add a `push` trigger
# in the copy only if that repository's owner wants every push published.
#
# Built by hand, the IG sites drift apart: each wears the harness chrome of the
# platform it was last built with (bean 48a6). So the site says what built it
# (`folio-build.json` at its root) and the run REPORTS any sibling built with
# a different platform — a message, never a failure. Two repository VARIABLES
# configure it, so a copy needs no edit:
#   FOLIO_SITE_SIBLINGS      site URLs to compare with, space-separated
#   FOLIO_SITE_DEPENDENCIES  owner/repo@ref of the IGs this one depends on,
#                            whose folio-site is re-run after a publish
# The rebuild needs the FOLIO_SITE_DISPATCH_TOKEN secret, a token that may run
# workflows in those repositories; without it the summary says what was NOT
# rebuilt. Owner, 2026-10-09: "1, but rebuild dependency for now". Keep the
# dependency list acyclic, or two sites will rebuild each other for ever.
name: folio site

on:
  workflow_dispatch:
    inputs:
      rebuild_ast:
        description: "Rebuild the IG's FHIR AST even when its cache is current"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: folio-site
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      INSTANCE: "@@INSTANCE@@"
      LABEL: "@@LABEL@@"
      # The `bun run cat` script that writes this IG's API sidecars from its
      # AST (`--ast <dir> --out <dir>`), or empty when it has none.
      SIDECARS_SCRIPT: ""
      BASE: /${{ github.event.repository.name }}
      MAIN_SITE: https://litlfred.github.io/folio-assistant
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: oven-sh/setup-bun@v2

      - name: Mount the platform's instances from its lock
        working-directory: folio-assistant
        # Since the separation (folio-assistant #2518) the platform's instances
        # (cat-harness, fhir-harness, folio-assistant-core, ...) are not in the
        # submodule: they are remote mounts pinned by its index.lock.json, laid
        # down by this script. Idempotent; it verifies each tree digest.
        run: bash .github/mount-from-lock.sh --root .

      - name: Install folio-assistant
        working-directory: folio-assistant
        run: bun install --frozen-lockfile

      - name: The IG's FHIR AST, from its cache
        id: ast
        run: |
          # The AST is the IG Publisher build itself, cached per IG on the
          # branch family cat/fhir-harness/fhir-ast/<package id> of THIS
          # repository (fhir-harness/scripts/ig-cache.sh). `valid` means it was
          # built from the inputs this checkout has; anything else is rebuilt
          # below, so a site is never drawn from an AST of other inputs.
          set +e
          verdict=missing
          if bash folio-assistant/fhir-harness/scripts/ig-cache.sh restore --ig-root .; then
            (cd folio-assistant && bun run fhir-harness/scripts/ig-ast.ts validity ../output-ast --ig .. > "$RUNNER_TEMP/ast-validity.json")
            case $? in 0) verdict=valid ;; 1) verdict=stale ;; *) verdict=cannot-tell ;; esac
          fi
          rebuild=false
          [ "$verdict" != valid ] && rebuild=true
          [ "${{ inputs.rebuild_ast }}" = "true" ] && rebuild=true
          echo "verdict=$verdict" >> "$GITHUB_OUTPUT"
          echo "rebuild=$rebuild" >> "$GITHUB_OUTPUT"
          echo "AST cache: $verdict; rebuild: $rebuild"

      - name: Java for the IG Publisher
        if: steps.ast.outputs.rebuild == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Node for SUSHI
        if: steps.ast.outputs.rebuild == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Ruby for the Publisher's Jekyll
        if: steps.ast.outputs.rebuild == 'true'
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"

      - name: Build the IG and export its AST
        if: steps.ast.outputs.rebuild == 'true'
        env:
          # litlfred/fhir-ig-publisher, branch claude/ast-export: a library ON
          # the released Publisher (skill ig-publisher-fork). Pinned, so a
          # rebuild runs the exporter this workflow was written against.
          AST_EXPORT_REF: d03a05a7bc298ce8079e0f14a47145f018db57f8
          # The Publisher's default (FhirSettings.getTxFhirProduction()).
          TX_SERVER: http://tx.fhir.org
        run: |
          set -o pipefail
          npm install -g fsh-sushi
          gem install jekyll --no-document
          git clone -q --filter=blob:none https://github.com/litlfred/fhir-ig-publisher "$RUNNER_TEMP/igp"
          git -C "$RUNNER_TEMP/igp" checkout -q "$AST_EXPORT_REF"
          (cd "$RUNNER_TEMP/igp/ast-export" && mvn -q -B -DskipTests compile dependency:build-classpath -Dmdep.outputFile=cp.txt)
          CP="$RUNNER_TEMP/igp/ast-export/target/classes:$(cat "$RUNNER_TEMP/igp/ast-export/cp.txt")"
          rm -rf output-ast
          # Absolute paths: the exporter refuses a relative -ig ("Computed path
          # does not start with first element: ., output-ast"), after the build.
          # -tx explicitly: the Publisher's own command line defaults it to the
          # production terminology server, but AstExportCli builds the Publisher
          # directly and leaves it unset, so the build ran with NO terminology
          # server (no external expansions; a ConceptMap narrative then fails on
          # a null terminology client).
          java -Xmx10g -cp "$CP" org.hl7.fhir.igtools.ast.AstExportCli -ig "$GITHUB_WORKSPACE" \
            -ast-out "$GITHUB_WORKSPACE/output-ast" -tx "$TX_SERVER" > "$RUNNER_TEMP/ast-build.log" 2>&1 \
            || { tail -n 80 "$RUNNER_TEMP/ast-build.log"; exit 1; }
          tail -n 20 "$RUNNER_TEMP/ast-build.log"
          # The build's own expansions, beside the AST: its ValueSets carry
          # none, and an IG's post-processing that enumerates codes needs them.
          cp output/expansions.json output-ast/expansions.json

      - name: Keep the AST build log
        if: always() && steps.ast.outputs.rebuild == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ast-build-log
          path: ${{ runner.temp }}/ast-build.log
          if-no-files-found: ignore

      - name: Seed the AST cache
        # Only the deploy branch writes the cache: a build of any other branch
        # uses its own AST for its own run and leaves the shared one alone.
        if: steps.ast.outputs.rebuild == 'true' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          bash folio-assistant/fhir-harness/scripts/ig-cache.sh seed --ig-root . --push

      - name: Leave only the AST of the Publisher build
        if: steps.ast.outputs.rebuild == 'true'
        # The staging below copies this checkout as the IG's source; the
        # Publisher's own output is not source, and is large.
        run: rm -rf output temp template fsh-generated input-cache

      - name: This IG's API sidecars, from the AST
        if: env.SIDECARS_SCRIPT != ''
        working-directory: folio-assistant
        # An IG whose post-processing writes API sidecars (JSON Schema, JSON-LD,
        # displays) names the script that writes them from the AST, as
        # `<script> --ast <output-ast> --out <dir>`; this template knows none.
        # They land in the served artefact index, where the pages link them.
        run: bun run cat "$SIDECARS_SCRIPT" --ast ../output-ast --out "$INSTANCE/fhir-artifact-index/sidecars"

      - name: The artefact index the AST describes
        working-directory: folio-assistant
        run: |
          # A published index, where the instance holds one, keeps two jobs: the
          # IG's own grouping, which the AST cannot know, and a parity report.
          args=()
          [ -f "$INSTANCE/fhir-artifact-index/index.json" ] && args+=(--compare "$INSTANCE/fhir-artifact-index/index.json" --keep-published-grouping --report "$RUNNER_TEMP/ast-parity.json")
          [ -d "$INSTANCE/fhir-artifact-index/sidecars" ] && args+=(--sidecars "$INSTANCE/fhir-artifact-index/sidecars" --sidecars-local fhir-artifact-index/sidecars)
          bun run fhir-harness/scripts/ast-to-artifact-index.ts --ast ../output-ast --instance-id "$INSTANCE" \
            "${args[@]}" --out "$RUNNER_TEMP/ast-index.json"

      - name: Generate this IG's pages, from the AST
        working-directory: folio-assistant
        # The instance's `docs/` (its `igSite` graph) is GENERATED, never
        # committed. Each artefact page links the resource's JSON from this
        # site's `ast-data/` and its JSON Schema and JSON-LD from the sidecars.
        run: bun run cat "$INSTANCE:pages" --index "$RUNNER_TEMP/ast-index.json" --compiled-data ast-data

      - name: Set up Ruby for the site
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
          working-directory: folio-assistant/cat-harness/docs

      - name: The main site's chrome, with this instance's navbar
        working-directory: folio-assistant
        run: |
          # --instance/--title/--link-root scope the shell's harness data to THIS
          # IG (#2263): its tiles, icon row, rail scope and title, with the
          # main site's graphs linked there and none of its counts shown here.
          bun run cat-harness-tools/scripts/compose-docs.ts --out "$RUNNER_TEMP/docs" --shell \
            --instance "$INSTANCE" --title "$LABEL" --link-root "$MAIN_SITE"
          bun run cat-harness-tools/scripts/gen-navbar-include.ts --instance "$INSTANCE" \
            --link-root "$MAIN_SITE" --title "$LABEL" \
            --out "$RUNNER_TEMP/docs/_includes/generated/navbar-footer.html"

      - name: Compose this IG at the site root
        working-directory: folio-assistant
        run: |
          curl -sSfL --retry 5 --retry-delay 15 --retry-all-errors -o "$RUNNER_TEMP/plantuml.jar" \
            https://repo1.maven.org/maven2/net/sourceforge/plantuml/plantuml/1.2024.7/plantuml-1.2024.7.jar
          # The work directory is OUTSIDE the checkout: the source copy is the
          # checkout, and a work directory inside it would copy itself.
          bun run fhir-harness/scripts/stage-ig-sites.ts --work "$RUNNER_TEMP/ig" --baseurl "$BASE" \
            --only "$INSTANCE" --source .. --plantuml-jar "$RUNNER_TEMP/plantuml.jar" \
            --compose-into "$RUNNER_TEMP/docs" --compose-at-root

      - name: This IG's QA records, on a QA page
        run: |
          # Every qa-results/v1 record the instance declares (its `qa` graph),
          # published under assets/ig-qa/ with a summary page at qa.html.
          # Read from THIS checkout: the platform's mount carries no `qa`
          # directory, and the records are committed beside the declaration.
          SCRIPT=folio-assistant/fhir-harness/scripts/ig-qa-page.ts
          DECL=$(git ls-files "$INSTANCE.json" "*/$INSTANCE.json" | head -1)
          if [ ! -f "$SCRIPT" ]; then
            echo "::notice::the pinned fhir-harness has no ig-qa-page.ts yet: no QA page in this build"
          elif [ -z "$DECL" ]; then
            echo "::notice::no $INSTANCE.json in this checkout: no QA page"
          else
            (cd folio-assistant && bun run fhir-harness/scripts/ig-qa-page.ts \
              --instance-root "$GITHUB_WORKSPACE/$(dirname "$DECL")" --docs "$RUNNER_TEMP/docs")
          fi

      - name: Build the site
        run: |
          BUNDLE_GEMFILE="$PWD/folio-assistant/cat-harness/docs/Gemfile" bundle exec jekyll build \
            --source "$RUNNER_TEMP/docs" --destination ./_site --baseurl "$BASE"
          bun run folio-assistant/fhir-harness/scripts/build-ig-site.ts --dedupe-ids ./_site
          # Each artefact's own JSON, as the AST holds it: what the pages' json
          # links and resource sections fetch (`../ast-data/`).
          mkdir -p ./_site/ast-data && cp -a output-ast/resources ./_site/ast-data/resources
          touch ./_site/.nojekyll

      - name: Publish this IG's served directories
        working-directory: folio-assistant
        run: |
          # Every `served: true` directory of THIS instance, read from its
          # declaration: the artefact index the JSON and IG API views fetch, and
          # the `openapi` graph that `openapi/index.html` links land on. The
          # graph's pages are generated here: only the ingested document is
          # committed, and its index is what the IG's Swagger links forward to.
          if [ -n "$(find "$INSTANCE" -maxdepth 3 -name cat-openapi.config.json -print -quit)" ]; then
            bun run cat-harness-tools/openapi/scripts/gen-openapi-pages.ts --instance "$INSTANCE"
          fi
          bun run fhir-harness/scripts/publish-served.ts --instance "$INSTANCE" --site ../_site

      - name: Give any page Jekyll did not lay out the same navbar
        working-directory: folio-assistant
        run: |
          bun run cat-harness-tools/scripts/rail-standalone-pages.ts --site ../_site --built cat-harness \
            --foreign-site --home-label "$LABEL" --instance "$INSTANCE"

      - name: Say which platform built this site
        working-directory: folio-assistant
        run: |
          bun run fhir-harness/scripts/site-build-stamp.ts stamp --site ../_site --instance "$INSTANCE" --platform .

      - name: Publish to gh-pages
        if: github.ref == 'refs/heads/main'
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: _site

      - name: Report platform drift against the sibling sites
        working-directory: folio-assistant
        run: |
          bun run fhir-harness/scripts/site-build-stamp.ts drift --self ../_site/folio-build.json \
            --sites "${{ vars.FOLIO_SITE_SIBLINGS }}"

      - name: Rebuild the IGs this one depends on
        if: github.ref == 'refs/heads/main'
        working-directory: folio-assistant
        env:
          FOLIO_SITE_DISPATCH_TOKEN: ${{ secrets.FOLIO_SITE_DISPATCH_TOKEN }}
        run: |
          bun run fhir-harness/scripts/site-build-stamp.ts dispatch --repos "${{ vars.FOLIO_SITE_DEPENDENCIES }}"
