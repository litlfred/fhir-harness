# TEMPLATE — an IG repository's OWN site: the platform's just-the-docs folio
# site with the IG composed at its root, published to that repository's
# gh-pages. Copy to `.github/workflows/site-publish.yml` unchanged: it has no
# placeholders.
#
# What the repository needs, and nothing else from the platform (owner,
# 2026-10-14: an IG repository "doesn't need its own harness. It can just
# define index.config.json and reference [its base harness] as a dependency"):
#
#   index.config.json   mounts the harness the IG is built on (and its
#                       closure), and names it as the site's landing:
#                         "site": { "landing": "<that harness>" }
#                       The landing scopes the site's chrome (tiles, navbar,
#                       rail); the site's TITLE is the IG's own, from
#                       sushi-config.yaml `title`.
#   index.lock.json     written by the platform's `remote-mount.ts` from it.
#   a workflow that calls the base harness's IG build (`ghbuild.yml`, or a
#                       `fhirbuild.yml` beside one): the IG build recipe the
#                       publish mirrors.
#
# No instance declaration (`<repo>.json`), no `package.json`, no committed
# menu: the menu is read from sushi-config.yaml at build time.
#
# What a run does — the agent's own command, `stage-local.ts`, on a runner:
#   1. mounts the layers index.lock.json pins (cat-harness-tools first, from
#      the lock, then everything else through it);
#   0. (job `ast`) refreshes the IG's AST cache through fhir-harness's own
#      `ig-ast-refresh.yml`: nothing when it is valid for this commit, the
#      Publisher AST export when it is missing or stale;
#   2. restores the IG's AST from its cache branch and judges it
#      (`ig-site:ast`); a stale AST refuses the publish, and no IG Publisher
#      runs in this job (ig-build-pipeline rule 1 and 2);
#   3. builds the folio site from it (`build-instance-site.ts`): the chrome
#      of the landing harness, the landing layer's IG API sidecars
#      (`ig-site:sidecars`, when it has the step), the IG's pages and the
#      thin artefact pages composed at the root (`ig-site:compose`), Jekyll,
#      the OpenAPI pages when the IG holds `openapi/` (`ig-site:openapi`),
#      the AST's data served (`ig-site:publisher-pages`), and the link check
#      (a dead link in the chrome refuses the publish; one in the IG's own
#      content is reported);
#   4. on the default branch publishes the gh-pages ROOT, keeping STAGING/,
#      _render-log/ and branches/; on any other branch the preview at
#      STAGING/<branch>/.
# `plan` prints what would run and publishes nothing. An agent runs the same
# command from its checkout, with --plan or --dry-run to look first.
#
# Manual trigger only (owner decision, 2026-10-06): add a `push` trigger to a
# copy only if that repository's owner asks for every push published.
name: Site publish (by hand)

on:
  workflow_dispatch:
    inputs:
      plan:
        description: "Only print what would run (--plan)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: site-publish
  cancel-in-progress: false

jobs:
  # The AST the site is built from, kept current by fhir-harness itself: a
  # no-op when the cache on `cat/fhir-harness/fhir-ast/<package id>` is valid
  # for this commit, the Publisher AST export when it is missing or stale
  # (owner, 2026-10-14: "this all should be a part of fhir-harness via
  # smart-base" — no IG repository carries a workflow of its own for it).
  ast:
    if: ${{ !inputs.plan }}
    uses: litlfred/fhir-harness/.github/workflows/ig-ast-refresh.yml@main
    with:
      # Always the default branch: only its build seeds the shared cache, so a
      # preview of a branch that leaves the IG's inputs as they are on it finds
      # a valid AST. A branch that changes the inputs is refused by
      # `ig-site:ast` (stale), as the route requires.
      ref: ${{ github.event.repository.default_branch }}

  publish:
    needs: ast
    if: ${{ always() && (needs.ast.result == 'success' || needs.ast.result == 'skipped') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # The job token is given to git ONCE, as the global header below.
          # A second copy from the checkout makes git send two Authorization
          # headers, which GitHub rejects: `ls-remote origin` failed and the
          # publish could not read the default branch.
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14  # the platform's CI version

      - name: Mount the layers index.lock.json pins
        run: |
          ref=$(python3 -c "import json;print(next(m['ref'] for m in json.load(open('index.lock.json'))['mounts'] if m['harness']=='cat-harness-tools'))")
          M="$RUNNER_TEMP/mounter"
          git init -q "$M"
          git -C "$M" fetch -q --depth 1 https://github.com/litlfred/cat-harness-tools.git "$ref"
          git -C "$M" checkout -q FETCH_HEAD
          bun run "$M/scripts/mount-from-lock.ts" --root .
          for d in $(python3 -c "import json;print(' '.join(sorted({i['path'] for i in json.load(open('index.lock.json'))['instances']})))"); do
            [ -f "$d/package.json" ] && (cd "$d" && bun install --no-save)
          done

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"

      - name: Identify the publishing commit's author, and let it push
        # The publisher clones gh-pages into a temporary directory, which does
        # not inherit the checkout's credentials: the job token goes in the
        # global config as a request HEADER, never in a URL. An insteadOf
        # rewrite put it in `git remote get-url origin`, and from there into
        # every page of a site (litlfred/smart-ra, 2026-10-14).
        env:
          TOKEN: ${{ github.token }}
        run: |
          git config --global user.name "Claude"
          git config --global user.email "noreply@anthropic.com"
          auth=$(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)
          echo "::add-mask::$auth"
          git config --global http.https://github.com/.extraheader "AUTHORIZATION: basic $auth"

      - name: Build and publish with stage-local
        # The job log is not readable from an agent's container, so a
        # failure's last lines are also raised as annotations (at most 10).
        run: |
          set -o pipefail
          if ! bun run cat-harness-tools/scripts/stage-local.ts --repo . ${{ inputs.plan && '--plan' || '' }} 2>&1 | tee "$RUNNER_TEMP/stage-local.log"; then
            grep -v '^|' "$RUNNER_TEMP/stage-local.log" | grep -E '✗|[Ee]rror|unresolved|failed|Cannot|not found|refus' | grep -v DEPRECATION | tail -n 9 | cut -c1-900 | sed 's/^/::error::/'
            exit 1
          fi
          if [ "${{ inputs.plan }}" = "true" ]; then
            grep -v '^|' "$RUNNER_TEMP/stage-local.log" | tail -n 9 | cut -c1-900 | sed 's/^/::notice::/'
          fi
