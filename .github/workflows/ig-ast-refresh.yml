# Refresh an IG's FHIR AST cache — the ONE place an IG Publisher run writes
# `cat/fhir-harness/fhir-ast/<package id>` (skill `ig-build-pipeline`,
# "The AST cache lifecycle"). Reusable: an IG repository calls it with a short
# caller (template: `templates/ig-repo-site/ig-ast-refresh.yml`); it carries no
# copy of these steps (owner, 2026-10-14: "that should be in fhir-harness then
# smart-* all use that").
#
# What a run does, and nothing else — no site build, no gh-pages, no dispatch
# of another repository's workflow:
#   1. checks out the CALLING repository at `ref` (default `main`);
#   2. mounts the layers the caller's index.lock.json pins (this layer's
#      `ig-cache.sh` and `ig-ast.ts` among them);
#   3. restores the cache and asks `ig-ast.ts validity` whether it was built
#      from the inputs that commit has (`valid`, `stale`, `cannot-tell`, or
#      `missing` when there is no cache);
#   4. when it is not `valid`, or `force` is set: runs the caller's
#      `pre-export` command, if it gives one, then builds the IG with the
#      Publisher AST exporter (`litlfred/fhir-ig-publisher`, branch
#      `claude/ast-export`, pinned by `ast-export-ref`; skill
#      `ig-publisher-fork`), checks the new AST is `valid` for the commit, and
#      seeds the cache branch with `ig-cache.sh seed --push`.
#   5. a later commit that changes no IG input does not make the cache stale
#      (`ig-ast.ts` `sameSourceAs`), so most merges need no rebuild.
#
# The cache is shared by every build of the IG, so only a build of a commit on
# the caller's DEFAULT branch whose inputs (sushi-config.yaml, ig.ini, input/)
# equal its tip's seeds it; a build of any other ref reports its verdict and
# keeps its AST to itself (as an artifact).
#
# `pre-export` is the hook for an OVERLAY: a command, in the caller's own
# checkout, that prepares the IG's inputs the way that IG's own build does
# before its Publisher run (pages registered, resources generated). This
# workflow knows nothing of what it does. It records the AST against the
# CLEAN commit's inputs: it takes their digest before the command runs, puts
# the inputs back after the export, checks the digest is the same again, and
# writes it into the manifest with `ig-ast.ts source-inputs` (the prepared
# tree's digest is kept beside it, under `preExport`). Otherwise the cache
# would record a tree no checkout has, and never verify.
#
# Nothing here may know about any one IG or publisher (fhir-harness/AGENTS.md).
name: IG AST refresh

on:
  workflow_call:
    inputs:
      ref:
        description: "The caller's ref to build (branch, tag or sha)"
        type: string
        default: main
      force:
        description: "Rebuild even when the cache is valid for the ref"
        type: boolean
        default: false
      ast-export-ref:
        description: "litlfred/fhir-ig-publisher commit carrying ast-export (AstExportCli)"
        type: string
        default: d03a05a7bc298ce8079e0f14a47145f018db57f8
      tx:
        description: "Terminology server the Publisher uses (its own default)"
        type: string
        default: http://tx.fhir.org
      pre-export:
        description: "Optional command run with bash at the IG root before the AST export: the caller's overlay. Its changes to the IG's inputs are not part of the source the AST is recorded against"
        type: string
        default: ""
    outputs:
      verdict:
        description: "The cache's verdict before the run: valid, stale, cannot-tell or missing"
        value: ${{ jobs.refresh.outputs.verdict }}
      seeded:
        description: "true when this run wrote the cache branch"
        value: ${{ jobs.refresh.outputs.seeded }}

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    concurrency:
      group: ig-ast-refresh-${{ github.repository }}
      cancel-in-progress: false
    outputs:
      verdict: ${{ steps.ast.outputs.verdict }}
      seeded: ${{ steps.seed.outputs.seeded }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          # Full history: validity accepts a later commit that changes no IG
          # input only when it can see the recorded commit is an ancestor.
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14  # the platform's CI version

      - name: Mount the layers index.lock.json pins
        run: |
          [ -f index.lock.json ] || { echo "::error::no index.lock.json: the caller must mount fhir-harness (templates/ig-repo-site)"; exit 2; }
          ref=$(python3 -c "import json;print(next(m['ref'] for m in json.load(open('index.lock.json'))['mounts'] if m['harness']=='cat-harness-tools'))")
          M="$RUNNER_TEMP/mounter"
          git init -q "$M"
          git -C "$M" fetch -q --depth 1 https://github.com/litlfred/cat-harness-tools.git "$ref"
          git -C "$M" checkout -q FETCH_HEAD
          bun run "$M/scripts/mount-from-lock.ts" --root .
          for d in fhir-harness folio-assistant-core cat-harness; do
            [ -f "$d/package.json" ] && (cd "$d" && bun install --no-save)
          done
          [ -f fhir-harness/scripts/ig-cache.sh ] || { echo "::error::the lock mounts no fhir-harness"; exit 2; }

      - name: The cache's verdict for this commit
        id: ast
        run: |
          set +e
          verdict=missing
          if bash fhir-harness/scripts/ig-cache.sh restore --ig-root .; then
            bun run fhir-harness/scripts/ig-ast.ts validity output-ast --ig . > "$RUNNER_TEMP/ast-validity.json"
            case $? in 0) verdict=valid ;; 1) verdict=stale ;; *) verdict=cannot-tell ;; esac
            cat "$RUNNER_TEMP/ast-validity.json"
          fi
          rebuild=false
          [ "$verdict" != valid ] && rebuild=true
          [ "${{ inputs.force }}" = "true" ] && rebuild=true
          echo "verdict=$verdict" >> "$GITHUB_OUTPUT"
          echo "rebuild=$rebuild" >> "$GITHUB_OUTPUT"
          echo "::notice::AST cache for $(git rev-parse --short HEAD): $verdict; rebuild: $rebuild"

      - name: Java for the IG Publisher
        if: steps.ast.outputs.rebuild == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Node for SUSHI
        if: steps.ast.outputs.rebuild == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Ruby for the Publisher's Jekyll
        if: steps.ast.outputs.rebuild == 'true'
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"

      - name: Build the IG and export its AST
        if: steps.ast.outputs.rebuild == 'true'
        env:
          AST_EXPORT_REF: ${{ inputs.ast-export-ref }}
          TX_SERVER: ${{ inputs.tx }}
          PRE_EXPORT: ${{ inputs.pre-export }}
        run: |
          set -o pipefail
          npm install -g fsh-sushi
          gem install jekyll --no-document
          git clone -q --filter=blob:none https://github.com/litlfred/fhir-ig-publisher "$RUNNER_TEMP/igp"
          git -C "$RUNNER_TEMP/igp" checkout -q "$AST_EXPORT_REF"
          (cd "$RUNNER_TEMP/igp/ast-export" && mvn -q -B -DskipTests compile dependency:build-classpath -Dmdep.outputFile=cp.txt)
          CP="$RUNNER_TEMP/igp/ast-export/target/classes:$(cat "$RUNNER_TEMP/igp/ast-export/cp.txt")"
          rm -rf output-ast
          if [ -n "$PRE_EXPORT" ]; then
            # The SOURCE's input digest, before anything prepares the tree. Only
            # here: a caller without pre-export may pin a fhir-harness whose
            # ig-ast.ts has no `digest` yet, and must not be broken by it.
            source_digest=$(bun run fhir-harness/scripts/ig-ast.ts digest --ig .) \
              || { echo "::error::pre-export needs a fhir-harness with \`ig-ast.ts digest\` and \`source-inputs\` (#55): repin the lock"; exit 1; }
            echo "::group::pre-export: $PRE_EXPORT"
            bash -c "$PRE_EXPORT" || { echo "::error::the pre-export command failed: nothing is exported"; exit 1; }
            echo "::endgroup::"
          fi
          # Absolute paths: the exporter refuses a relative -ig. -tx explicitly:
          # AstExportCli builds the Publisher directly and leaves it unset, so
          # without it the build runs with NO terminology server.
          java -Xmx10g -cp "$CP" org.hl7.fhir.igtools.ast.AstExportCli -ig "$GITHUB_WORKSPACE" \
            -ast-out "$GITHUB_WORKSPACE/output-ast" -tx "$TX_SERVER" > "$RUNNER_TEMP/ast-build.log" 2>&1 \
            || { tail -n 80 "$RUNNER_TEMP/ast-build.log"; exit 1; }
          tail -n 20 "$RUNNER_TEMP/ast-build.log"
          # The build's own expansions, beside the AST: its ValueSets carry none.
          [ -f output/expansions.json ] && cp output/expansions.json output-ast/expansions.json
          # Put the IG's inputs back as the commit has them, ALWAYS: the
          # Publisher writes under input/ during a build (it renders
          # input/images-source/*.plantuml into input/images/*.svg, overwriting
          # tracked files and adding untracked ones), so a digest of the work
          # tree after the build is not the commit's (an IG repository's run
          # 38609595363: recorded 35047502..., re-hashed 079a4e58...). Plain
          # git, so it works with whichever fhir-harness the caller's lock
          # mounts; a fhir-harness with `validity --at` can check the commit
          # without it.
          for p in sushi-config.yaml ig.ini input; do
            if git ls-files --error-unmatch -- "$p" > /dev/null 2>&1; then git checkout -q HEAD -- "$p"; fi
          done
          git clean -fdq -- sushi-config.yaml ig.ini input
          if [ -n "$PRE_EXPORT" ]; then
            # Check the inputs are the commit's, and record the AST against them.
            now=$(bun run fhir-harness/scripts/ig-ast.ts digest --ig .)
            [ "$now" = "$source_digest" ] \
              || { echo "::error::the inputs are not the commit's after the pre-export was undone ($now, not $source_digest)"; exit 1; }
            bun run fhir-harness/scripts/ig-ast.ts source-inputs output-ast --digest "$source_digest" --pre-export "$PRE_EXPORT"
          fi
          # The new AST must be valid for the commit it was built from, or it
          # is not seeded: a cache that fails its own check is worse than none.
          bun run fhir-harness/scripts/ig-ast.ts validity output-ast --ig . \
            || { echo "::error::the AST just built is not valid for $(git rev-parse --short HEAD)"; exit 1; }

      - name: Keep the AST build log
        if: always() && steps.ast.outputs.rebuild == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ast-build-log
          path: ${{ runner.temp }}/ast-build.log
          if-no-files-found: ignore

      - name: Seed the AST cache
        id: seed
        if: steps.ast.outputs.rebuild == 'true'
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          # Seeded when the built commit is on the default branch and the IG's
          # inputs at its tip are the same: a merge during the (long) build
          # that touches no input does not waste the run.
          head=$(git rev-parse HEAD)
          branch="${DEFAULT_BRANCH:-main}"
          git fetch -q origin "refs/heads/$branch"
          tip=$(git rev-parse FETCH_HEAD)
          if ! git merge-base --is-ancestor "$head" "$tip" || ! git diff --quiet "$head" "$tip" -- sushi-config.yaml ig.ini input; then
            echo "::notice::$head is not on $branch with $branch's inputs ($tip): the shared cache is left alone"
            echo "seeded=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          bash fhir-harness/scripts/ig-cache.sh seed --ig-root . --push
          echo "seeded=true" >> "$GITHUB_OUTPUT"

      - name: Keep the AST when it was not seeded
        if: steps.ast.outputs.rebuild == 'true' && steps.seed.outputs.seeded != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: output-ast
          path: output-ast
          if-no-files-found: ignore
