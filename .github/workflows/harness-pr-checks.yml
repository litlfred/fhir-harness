# fhir-harness's checks on every pull request (owner, 2026-10-14: every
# harnessed layer is judged by ONE reusable workflow the harness owns, and
# "there shouldnt be copying of code"). Everything is decided there.
name: Harness PR checks

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
  # main's own run keeps main's answer, the gate seconds and the cone records
  # in caches every PR can read (cat-harness-tools#406, #411); a run on a PR
  # can only read caches saved from its own PR or from main.
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    uses: litlfred/cat-harness-tools/.github/workflows/layer-pr-checks.yml@main
    with:
      # The IG site imports cat-harness-tools' shared page layout by path (`scripts/page-layout.ts`), not by package name, so
      # `auto` cannot see it. Take it at main, which a pin in the index may predate.
      layers-at-main: cat-harness-tools
